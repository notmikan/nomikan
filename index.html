<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoPE</title>

  <!-- ファビコン・アプリアイコン設定 -->
  <link rel="icon" href="icon.webp" type="image/webp">
  <link rel="apple-touch-icon" href="icon.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- モジュールCSSの読み込み -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/sns.css">
  <link rel="stylesheet" href="css/inventory.css">

  <!-- Firebase JS SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>

<body>

  <!-- トップアプリヘッダー -->
  <header class="app-header">
    <div class="header-brand">
      <h1 class="app-title"><img src="icon.webp" alt="HoPE" class="app-logo-img" width="24" height="24"
          style="width: 24px; height: 24px; max-width: 24px; max-height: 24px; object-fit: contain; flex-shrink: 0;">
        <span>HoPE</span></h1>
      <nav class="app-tabs">
        <button class="nav-tab active" data-tab="timetable">スケジュール</button>
        <button class="nav-tab" data-tab="home">チャット</button>
        <button class="nav-tab" data-tab="inventory">在庫</button>
        <button class="nav-tab" data-tab="budget">サマリー</button>
      </nav>
    </div>

    <!-- 同期ステータス -->
    <div class="sync-status-container">
      <div class="db-status-badge local" id="dbStatusBadge">
        <span class="status-dot"></span>
        <span id="dbStatusText">ローカル</span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="main-content">

    <!-- ホーム（タイムライン / チャット）ビュー -->
    <section id="homeTab" class="tab-content">
      <div class="timeline-section">
        <div class="x-tab-header">
          <button class="x-tab-item active" data-post-team="all">すべて</button>
          <button class="x-tab-item" data-post-team="雑談">#雑談</button>
          <button class="x-tab-item" data-post-team="運営">#運営</button>
          <button class="x-tab-item" data-post-team="FRP">#FRP</button>
          <button class="x-tab-item" data-post-team="翼">#翼</button>
          <button class="x-tab-item" data-post-team="コクピ">#コクピ</button>
          <button class="x-tab-item" data-post-team="電装">#電装</button>
        </div>
        <div class="posts-timeline-grid" id="postsTimelineGrid">
          <!-- JSでタイムラインポストを描画 -->
        </div>
      </div>
    </section>

    <!-- スケジュール（旧タイムテーブル）タブビュー -->
    <section id="timetableTab" class="tab-content active">
      <!-- 1段目: [< 2026年 11月 >] ＋ [月間/年間] ＋ [＋追加] -->
      <div class="schedule-top-bar">
        <div class="month-nav-controls" id="monthNavToolbar">
          <button type="button" class="month-nav-btn" id="prevMonthBtn" title="前月">◀</button>
          <span class="month-nav-label" id="currentMonthLabel" title="クリックで今月に戻る" style="cursor: pointer;">2026年 11月</span>
          <button type="button" class="month-nav-btn" id="nextMonthBtn" title="次月">▶</button>
        </div>

        <div class="schedule-actions">
          <!-- 年間 ⇔ 月間 ビュー切り替えトグル -->
          <div class="view-toggle-group">
            <button type="button" class="view-toggle-btn active" id="viewToggleMonth">月間</button>
            <button type="button" class="view-toggle-btn" id="viewToggleYear">年間</button>
          </div>
          <button class="btn btn-primary btn-add-compact" id="addBtn">＋追加</button>
        </div>
      </div>

      <!-- 2段目: 班フィルター [全体] [運営] [FRP] [翼] [コクピ] [電装] -->
      <div class="schedule-filter-bar">
        <div class="filter-group">
          <button class="filter-btn active" data-team="all">全体</button>
          <button class="filter-btn" data-team="運営">運営</button>
          <button class="filter-btn" data-team="FRP">FRP</button>
          <button class="filter-btn" data-team="翼">翼</button>
          <button class="filter-btn" data-team="コクピ">コクピ</button>
          <button class="filter-btn" data-team="電装">電装</button>
        </div>
      </div>

      <!-- ガントチャートコンテナ -->
      <div class="container">
        <div id="ganttGrid">
          <!-- JSで描画 -->
        </div>
      </div>
    </section>

    <!-- 予算管理タブビュー (準備中) -->
    <section id="budgetTab" class="tab-content">
      <div class="placeholder-card">
        <div class="placeholder-icon">💰</div>
        <h2>予算管理モジュール</h2>
        <p>購入申請・部費管理機能（準備中）</p>
      </div>
    </section>

    <!-- 在庫管理タブビュー -->
    <section id="inventoryTab" class="tab-content">
      <div class="sub-toolbar">
        <div class="toolbar-left">
          <div class="filter-group">
            <button class="filter-btn active inventory-filter-btn" data-team="all">全体</button>
            <button class="filter-btn inventory-filter-btn" data-team="運営">運営</button>
            <button class="filter-btn inventory-filter-btn" data-team="FRP">FRP</button>
            <button class="filter-btn inventory-filter-btn" data-team="翼">翼</button>
            <button class="filter-btn inventory-filter-btn" data-team="コクピ">コクピ</button>
            <button class="filter-btn inventory-filter-btn" data-team="電装">電装</button>
          </div>
        </div>
        <div class="toolbar-right" style="display: flex; gap: 8px; align-items: center;">
          <input type="text" id="inventorySearchInput" class="form-control" placeholder="資材・部品・工具を検索..."
            style="width: 200px;">
          <button class="btn btn-primary" id="addInventoryBtn">＋ 資材を追加</button>
        </div>
      </div>

      <!-- 在庫カード一覧グリッド -->
      <div id="inventoryGrid" class="inventory-cards-grid">
        <!-- JSで動的描画 -->
      </div>
    </section>

  </main>

  <!-- メンバー・タスク詳細・作業ToDoモーダル (2列レイアウト) -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">タスク詳細</div>
        <button class="action-btn" id="closeModal">✕</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">

        <div class="task-modal-body-grid">
          <!-- 【左カラム】 基本設定 ＆ メモ -->
          <div class="modal-col-left">
            <div class="form-group">
              <label>タスク名</label>
              <input type="text" id="taskName" class="form-control" placeholder="タスク名を入力..." required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>担当班</label>
                <select id="taskTeam" class="form-control">
                  <option value="運営">運営</option>
                  <option value="FRP">FRP</option>
                  <option value="翼">翼</option>
                  <option value="コクピ">コクピ</option>
                  <option value="電装">電装</option>
                </select>
              </div>
              <div class="form-group">
                <label>担当者</label>
                <input type="text" id="taskAssignee" class="form-control" placeholder="担当者名 (省略可)">
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 8px;">
              <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px;">
                <input type="checkbox" id="enableSpecificDate"> 日付で指定する
              </label>
            </div>

            <div class="form-row" id="specificDateContainer" style="display: none;">
              <div class="form-group">
                <label>開始日</label>
                <input type="date" id="taskStartDate" class="form-control">
              </div>
              <div class="form-group">
                <label>終了日</label>
                <input type="date" id="taskEndDate" class="form-control">
              </div>
            </div>

            <div class="form-row" id="monthSelectContainer">
              <div class="form-group">
                <label>開始月</label>
                <select id="taskStart" class="form-control" required>
                  <option value="8">8月</option>
                  <option value="9">9月</option>
                  <option value="10">10月</option>
                  <option value="11">11月</option>
                  <option value="12">12月</option>
                  <option value="1">1月</option>
                  <option value="2">2月</option>
                  <option value="3">3月</option>
                  <option value="4">4月</option>
                  <option value="5">5月</option>
                  <option value="6">6月</option>
                  <option value="7">7月</option>
                </select>
              </div>
              <div class="form-group">
                <label>終了月</label>
                <select id="taskEnd" class="form-control" required>
                  <option value="8">8月</option>
                  <option value="9">9月</option>
                  <option value="10">10月</option>
                  <option value="11">11月</option>
                  <option value="12">12月</option>
                  <option value="1">1月</option>
                  <option value="2">2月</option>
                  <option value="3">3月</option>
                  <option value="4">4月</option>
                  <option value="5">5月</option>
                  <option value="6">6月</option>
                  <option value="7">7月</option>
                </select>
              </div>
            </div>

            <!-- メモ -->
            <div class="form-group" style="margin-top: 10px;">
              <label style="font-weight: 700; color: #0f172a; font-size: 13px;">メモ</label>
              <textarea id="taskNote" class="form-control" placeholder="注意事項や資材メモなど..." rows="3"
                style="font-size: 13px; line-height: 1.5; resize: vertical;"></textarea>
            </div>
          </div>

          <!-- 【右カラム】 ToDoリスト (白背景・シームレス) -->
          <div class="modal-col-right" style="height: 100%; display: flex; flex-direction: column;">
            <div class="form-group" style="flex: 1; display: flex; flex-direction: column; margin-bottom: 0;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label style="margin-bottom: 0; font-weight: 700; color: #0f172a; font-size: 13px;">
                  ToDoリスト <span id="taskTodoCountText" style="font-size: 11px; font-weight: 600; color: #64748b; margin-left: 4px;"></span>
                </label>
                <button type="button" id="copyTodoFromTaskBtn" class="btn-copy-todo" title="他のタスクからToDo手順を一括コピー">
                  他タスクからコピー
                </button>
              </div>

              <!-- 他タスクからコピー用の選択バー (初期は非表示) -->
              <div id="copyTodoSelectBar"
                style="display: none; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; gap: 6px; align-items: center;">
                <select id="copyTodoSourceSelect" class="form-control"
                  style="font-size: 12px; padding: 4px 8px; height: 30px; flex: 1;">
                  <!-- JSで動的生成 -->
                </select>
                <button type="button" id="confirmCopyTodoBtn" class="btn btn-primary"
                  style="font-size: 11px; padding: 4px 10px; height: 30px; white-space: nowrap;">コピー</button>
                <button type="button" id="cancelCopyTodoBtn" class="btn"
                  style="font-size: 11px; padding: 4px 8px; height: 30px;">✕</button>
              </div>

              <!-- ToDoアイテム一覧 (白背景リスト枠・末尾に常駐インライン入力行) -->
              <div id="todoListContainer"
                style="flex: 1; min-height: 240px; max-height: 320px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                <!-- JSで動的描画 -->
              </div>
            </div>
          </div>
        </div>

        <div class="modal-actions" style="margin-top: 16px;">
          <button type="button" class="btn btn-danger" id="deleteModalBtn"
            style="margin-right:auto; display:none;">削除</button>
          <button type="button" class="btn" id="cancelBtn">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DB設定モーダル -->
  <div class="modal-overlay" id="dbConfigModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">データベース設定</div>
        <button class="action-btn" id="closeDbConfigModal">✕</button>
      </div>
      <form id="dbConfigForm">
        <div class="form-group">
          <label>Firebase Realtime Database URL</label>
          <input type="text" id="firebaseUrlInput" class="form-control"
            placeholder="https://your-app-default-rtdb.firebaseio.com">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="resetDbConfigBtn">ローカルへ戻す</button>
          <button type="submit" class="btn btn-primary" style="margin-left: auto;">接続テスト・保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- メンバープロフィール設定モーダル -->
  <div class="modal-overlay" id="userProfileModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">プロフィール設定</div>
        <button class="action-btn" id="closeProfileModal" style="display:none;">✕</button>
      </div>
      <form id="userProfileForm" style="margin-top: 16px;">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
          <div class="x-avatar" id="profileAvatarPreview"
            style="width: 56px; height: 56px; font-size: 20px; flex-shrink:0;">👤</div>
          <div>
            <label for="modalAvatarInput" class="btn btn-secondary btn-sm" style="cursor: pointer;">📷 アイコン画像を変更</label>
            <input type="file" id="modalAvatarInput" accept="image/*" style="display: none;">
          </div>
        </div>
        <div class="form-group">
          <label>表示名</label>
          <input type="text" id="modalAuthorInput" class="form-control" placeholder="例: 山田" required>
        </div>
        <div class="form-group">
          <label>メイン所属班</label>
          <select id="modalTeamSelect" class="form-control">
            <option value="FRP">FRP班</option>
            <option value="翼">翼班</option>
            <option value="コクピ">コクピ班</option>
            <option value="電装">電装班</option>
            <option value="運営">運営</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" style="width:100%;">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新規投稿モーダル -->
  <div class="modal-overlay" id="xPostComposeModal">
    <div class="x-modal-card">
      <div class="modal-header" style="margin-bottom: 12px;">
        <div class="modal-title">新規投稿</div>
        <button class="action-btn" id="closeComposeModalBtn">✕</button>
      </div>
      <form id="createPostForm">
        <div class="x-compose-row">
          <div class="x-avatar x-avatar-FRP" id="currentComposeAvatar">👤</div>
          <div class="x-compose-body">
            <div class="x-user-meta-bar">
              <div class="x-user-info-text">
                <span class="x-user-name" id="currentLoginUserName">未設定</span>
              </div>
              <button type="button" class="btn-link-sm" id="changeProfileBtn">⚙️ 変更</button>
            </div>
            <textarea id="postContentInput" class="x-textarea" rows="3" placeholder="いまどうしてる？" required></textarea>

            <!-- 📷 写真プレビュー枠 -->
            <div class="x-image-preview-bar" id="imagePreviewBar"></div>

            <div class="x-compose-bottom">
              <div style="display:flex; align-items:center; gap:8px;">
                <select id="postCategorySelect" class="post-category-select">
                  <option value="雑談">#雑談</option>
                  <option value="FRP">#FRP</option>
                  <option value="翼">#翼</option>
                  <option value="コクピ">#コクピ</option>
                  <option value="電装">#電装</option>
                  <option value="運営">#運営</option>
                </select>
                <label for="postImageInput" class="btn-attach-image" title="写真を追加">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                </label>
                <input type="file" id="postImageInput" accept="image/*" multiple style="display:none;">
              </div>
              <button type="submit" class="btn-x-post" id="submitPostBtn">
                投稿
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 🔍 画像拡大鑑賞モーダル -->
  <div class="modal-overlay" id="imageLightboxModal" style="z-index: 999999;">
    <div class="lightbox-content">
      <button class="action-btn lightbox-close" id="closeLightboxBtn">✕</button>
      <img id="lightboxImage" src="" alt="拡大画像" class="lightbox-img">
    </div>
  </div>

  <!-- 📱 右下固定 浮遊投稿ボタン (FAB) -->
  <button class="x-fab-post-btn" id="openComposeFabBtn" title="投稿" style="display: none;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </svg>
  </button>

  <!-- 📱 スマホ専用 固定ボトムナビゲーションバー (X風 モノトーン SVG) -->
  <nav class="mobile-bottom-nav">
    <button class="nav-item active" data-tab="timetable">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </span>
      <span class="nav-label">スケジュール</span>
    </button>
    <button class="nav-item" data-tab="home">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </span>
      <span class="nav-label">チャット</span>
    </button>
    <button class="nav-item" data-tab="inventory">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
          </path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </span>
      <span class="nav-label">在庫</span>
    </button>
    <button class="nav-item" data-tab="budget">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </span>
      <span class="nav-label">サマリー</span>
    </button>
  </nav>

  <!-- 📦 資材・部品在庫 追加・編集モーダル -->
  <div class="modal-overlay" id="inventoryModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="inventoryModalTitle">資材を追加</div>
        <button class="action-btn" id="closeInventoryModal">✕</button>
      </div>
      <form id="inventoryForm">
        <input type="hidden" id="inventoryId">

        <div class="form-group">
          <label>品名 (名称)</label>
          <input type="text" id="inventoryName" class="form-control" placeholder="例: カーボンクロス #200" required>
        </div>

        <div class="form-group">
          <label>所有班 (複数選択可)</label>
          <div
            style="display: flex; gap: 12px; flex-wrap: wrap; background: #f8fafc; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1;">
            <label
              style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600;">
              <input type="checkbox" name="inventoryTeamCheck" value="FRP"> FRP
            </label>
            <label
              style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600;">
              <input type="checkbox" name="inventoryTeamCheck" value="翼"> 翼
            </label>
            <label
              style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600;">
              <input type="checkbox" name="inventoryTeamCheck" value="コクピ"> コクピ
            </label>
            <label
              style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600;">
              <input type="checkbox" name="inventoryTeamCheck" value="電装"> 電装
            </label>
            <label
              style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600;">
              <input type="checkbox" name="inventoryTeamCheck" value="運営"> 運営
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>数量 ＆ 単位</label>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="inventoryQty" class="form-control" value="1" min="0" required style="flex: 1;">
            <select id="inventoryUnit" class="form-control" style="width: 100px;">
              <option value="個">個</option>
              <option value="本">本</option>
              <option value="枚">枚</option>
              <option value="巻">巻</option>
              <option value="缶">缶</option>
              <option value="セット">セット</option>
              <option value="kg">kg</option>
              <option value="m">m</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>メモ</label>
          <textarea id="inventoryNote" class="form-control" rows="3" placeholder="メモを入力..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="deleteInventoryModalBtn"
            style="margin-right:auto; display:none;">削除</button>
          <button type="button" class="btn" id="cancelInventoryBtn">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
