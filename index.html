<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoPE 27代 サークル統合Webアプリケーション</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase JS SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- トップアプリヘッダー -->
  <header class="app-header">
    <div class="header-brand">
      <h1>
        <span class="logo-icon">✈️</span> HoPE 統合Webアプリ
        <span class="version-tag">v2.0 Realtime</span>
      </h1>
      <!-- ナビゲーションタブ（拡張用） -->
      <nav class="app-tabs">
        <button class="nav-tab active" data-tab="timetable">🗓️ タイムテーブル</button>
        <button class="nav-tab" data-tab="budget">💰 予算管理 <span class="tab-badge">Soon</span></button>
        <button class="nav-tab" data-tab="inventory">📦 部品・資材在庫 <span class="tab-badge">Soon</span></button>
        <button class="nav-tab" data-tab="members">👥 メンバー・シフト <span class="tab-badge">Soon</span></button>
        <button class="nav-tab" data-tab="admin">🔒 幹部設定 <span class="tab-badge">Soon</span></button>
      </nav>
    </div>

    <!-- リアルタイム通信ステータス ＆ 設定 -->
    <div class="sync-status-container">
      <div class="db-status-badge local" id="dbStatusBadge" title="クリックしてFirebase設定を変更">
        <span class="status-dot"></span>
        <span id="dbStatusText">ローカル同期モード</span>
      </div>
      <button class="btn btn-secondary btn-sm" id="openDbConfigBtn">
        ⚙️ DB設定
      </button>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="main-content">

    <!-- 🗓️ タイムテーブルタブビュー -->
    <section id="timetableTab" class="tab-content active">
      
      <!-- サブツールバー -->
      <div class="sub-toolbar">
        <div class="toolbar-left">
          <span class="view-badge" id="viewModeBadge">全体概要モード</span>
          <div class="filter-group">
            <button class="filter-btn active" data-team="all">全体概要</button>
            <button class="filter-btn" data-team="全体">全体</button>
            <button class="filter-btn" data-team="FRP">FRP</button>
            <button class="filter-btn" data-team="翼">翼</button>
            <button class="filter-btn" data-team="コクピ">コクピ</button>
            <button class="filter-btn" data-team="電装">電装</button>
          </div>
        </div>

        <div class="toolbar-right">
          <input type="text" id="searchInput" class="search-input" placeholder="タスク・担当・メモ検索...">
          <button class="btn btn-primary" id="addBtn">
            ➕ タスク追加
          </button>
        </div>
      </div>

      <!-- ガントチャートコンテナ -->
      <div class="container">
        <div id="ganttGrid">
          <!-- 動的描画 (app.js) -->
        </div>

        <div class="footer-bar">
          <div class="legend-dots">
            <div class="legend-item"><div class="legend-dot" style="background: var(--color-all)"></div> 全体・運用</div>
            <div class="legend-item"><div class="legend-dot" style="background: var(--color-frp)"></div> FRP班</div>
            <div class="legend-item"><div class="legend-dot" style="background: var(--color-wing)"></div> 翼班</div>
            <div class="legend-item"><div class="legend-dot" style="background: var(--color-cockpit)"></div> コクピ班</div>
            <div class="legend-item"><div class="legend-dot" style="background: var(--color-elec)"></div> 電装班</div>
          </div>
          <div class="sync-info-text" id="syncInfoText">
            ※ 変更内容はリアルタイムで全メンバーに同期されます
          </div>
        </div>
      </div>

    </section>

    <!-- プレースホルダー タブビュー (将来機能用) -->
    <section id="placeholderTab" class="tab-content">
      <div class="placeholder-card">
        <div class="placeholder-icon" id="placeholderIcon">💰</div>
        <h2 id="placeholderTitle">モジュール準備中</h2>
        <p id="placeholderDesc">この機能モジュールは現在開発ロードマップ（Phase 3〜）に基づき準備中です。</p>
        <button class="btn btn-primary" onclick="switchTab('timetable')">🗓️ タイムテーブルに戻る</button>
      </div>
    </section>

  </main>

  <!-- モーダルダイアログ: タスク追加・編集 -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">➕ タスクの追加</div>
        <button class="action-btn" id="closeModal">✕</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-group">
          <label>所属班</label>
          <select id="taskTeam" class="form-control" required>
            <option value="全体">全体・運用</option>
            <option value="FRP">FRP班</option>
            <option value="翼">翼班</option>
            <option value="コクピ">コクピ班</option>
            <option value="電装">電装班</option>
          </select>
        </div>
        <div class="form-group">
          <label>タスク名</label>
          <input type="text" id="taskName" class="form-control" placeholder="例: T桁の積層" required>
        </div>
        <div class="form-group">
          <label>担当者</label>
          <input type="text" id="taskAssignee" class="form-control" placeholder="例: 大野 / FRP班" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>開始月</label>
            <select id="taskStart" class="form-control" required>
              <option value="8">8月</option>
              <option value="9">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
              <option value="1">1月</option>
              <option value="2">2月</option>
              <option value="3">3月</option>
              <option value="4">4月</option>
              <option value="5">5月</option>
              <option value="6">6月</option>
              <option value="7">7月</option>
            </select>
          </div>
          <div class="form-group">
            <label>終了月</label>
            <select id="taskEnd" class="form-control" required>
              <option value="8">8月</option>
              <option value="9">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
              <option value="1">1月</option>
              <option value="2">2月</option>
              <option value="3">3月</option>
              <option value="4">4月</option>
              <option value="5">5月</option>
              <option value="6">6月</option>
              <option value="7">7月</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>備考・マイルストーンメモ</label>
          <input type="text" id="taskNote" class="form-control" placeholder="例: 11月までに完成させる">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="deleteModalBtn" style="margin-right:auto; display:none;">🗑️ このタスクを削除</button>
          <button type="button" class="btn" id="cancelBtn">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダルダイアログ: Firebase DB設定 -->
  <div class="modal-overlay" id="dbConfigModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">⚙️ Firebase リアルタイムDB設定</div>
        <button class="action-btn" id="closeDbModal">✕</button>
      </div>
      <div class="db-config-info">
        <p>FirebaseのRealtime Databaseの設定を入力すると、全メンバーでリアルタイム編集が有効化されます。（空の場合はローカル保存モードで動作します）</p>
      </div>
      <form id="dbConfigForm">
        <div class="form-group">
          <label>Firebase Config (JSON形式 または databaseURL)</label>
          <textarea id="firebaseConfigInput" class="form-control code-font" rows="6" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "hope-app.firebaseapp.com",
  "databaseURL": "https://hope-app-default-rtdb.firebaseio.com",
  "projectId": "hope-app",
  "storageBucket": "hope-app.appspot.com",
  "messagingSenderId": "...",
  "appId": "..."
}'></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="resetDbConfigBtn" style="margin-right:auto;">ローカルモードに戻す</button>
          <button type="button" class="btn" id="cancelDbBtn">キャンセル</button>
          <button type="submit" class="btn btn-primary">設定を保存して接続</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
